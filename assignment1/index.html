<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment 1: Contact Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Contact Form</h1>

            <form action="#" method="post">

              <!-- Name -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="firstName" class="form-label">First Name</label>
                  <input type="text" class="form-control" id="firstName" name="firstName">
                </div>
                <div class="col-md-6 mb-3">
                  <label for="lastName" class="form-label">Last Name</label>
                  <input type="text" class="form-control" id="lastName" name="lastName">
                </div>
              </div>

              <!-- Address -->
              <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address">
              </div>

              <div class="row">
                <div class="col-md-5 mb-3">
                  <label for="city" class="form-label">City</label>
                  <input type="text" class="form-control" id="city" name="city">
                </div>
                <div class="col-md-4 mb-3">
                  <label for="state" class="form-label">State</label>
                  <select class="form-select" id="state" name="state">
                    <option value="IL">Illinois</option>
                    <option value="IN">Indiana</option>
                    <option value="MI" selected>Michigan</option>
                    <option value="OH">Ohio</option>
                    <option value="WI">Wisconsin</option>
                  </select>
                </div>
                <div class="col-md-3 mb-3">
                  <label for="zip" class="form-label">Zip</label>
                  <input type="text" class="form-control" id="zip" name="zip">
                </div>
              </div>

              <!-- Phone and Email -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="phone" class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="phone" name="phone">
                </div>
                <div class="col-md-6 mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email">
                </div>
              </div>

              <!-- Preferred method of contact -->
              <fieldset class="mb-4">
                <legend class="form-label fs-6">Preferred Method of Contact</legend>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="preferredContact" id="contactEmail" value="Email">
                  <label class="form-check-label" for="contactEmail">Email</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="preferredContact" id="contactText" value="Text">
                  <label class="form-check-label" for="contactText">Text</label>
                </div>
              </fieldset>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Submit</button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
